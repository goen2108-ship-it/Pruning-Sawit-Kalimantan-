<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasa Pruning Sawit Kalimantan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f0;
            color: #1a3d1a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            width: 320px;
        }
        .logo {
            margin-bottom: 20px;
        }
        .logo svg {
            width: 100px;
            height: 100px;
            fill: #1a3d1a;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: bold;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 20px;
            letter-spacing: 2px;
        }
        p.phone {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #1a3d1a;
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Icon yang merepresentasikan seseorang dengan mesin potong rumput -->
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                <path d="M22 44a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM32 44a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM42 44a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                <path d="M15 30h1v7h-1zm10-2h1v9h-1zm10 0h1v12h-1z"/>
                <path d="M25 25l-5-5v-2l7 5-2 2zm5-10a5 5 0 1 1-10 0 5 5 0 0 1 10 0z"/>
            </svg>
        </div>
        <h1>JASA PRUNING SAWIT</h1>
        <h2>KALIMANTAN</h2>
        <p class="phone">0821 8994 7304</p>
        <footer>
            &copy; 2024 Jasa Pruning Sawit Kalimantan. All rights reserved.
        </footer>
    </div>
</body>
</html>
